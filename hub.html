<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emorce Hub · Dashboard</title>
  <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#050508; --card:rgba(18,14,22,.88); --line:rgba(255,80,120,.2);
      --pink:#ff2d6a; --rose:#ff5e8a; --crimson:#dc143c; --text:#f7f2f5; --muted:#9a8f98; --ok:#5dffb1;
      --font:"Inter",ui-sans-serif,system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:var(--font);color:var(--text);min-height:100vh;
      background:
        radial-gradient(900px 420px at 20% -10%, rgba(220,20,60,.18), transparent 55%),
        radial-gradient(700px 400px at 90% 100%, rgba(80,0,40,.22), transparent 50%),
        var(--bg);
    }
    .wrap{width:min(1080px,calc(100% - 36px));margin:0 auto;padding:36px 0 70px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700}
    .brand img{width:38px;height:38px;border-radius:11px;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 18px rgba(255,45,106,.3)}
    h1{font-size:1.45rem;letter-spacing:-.03em}
    .muted{color:var(--muted);font-size:.9rem;margin-top:3px}
    .btn{
      display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;
      padding:10px 14px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.9rem;
      transition:transform .15s,background .15s,box-shadow .15s;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-p{background:linear-gradient(135deg,var(--pink),#dc143c);color:#fff;box-shadow:0 10px 28px rgba(220,20,60,.3)}
    .btn-g{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--muted)}
    .btn-g:hover{color:var(--text)}
    .card{
      background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:18px;
      padding:18px;margin-top:14px;backdrop-filter:blur(10px);
      animation:fadeUp .45s ease both;
    }
    h2{font-size:1.05rem;margin-bottom:12px}
    pre{
      background:#08060a;border:1px solid rgba(255,255,255,.06);border-radius:12px;
      padding:14px;overflow:auto;color:#ffc0d0;
      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;
    }
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .gcard{
      position:relative;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.06);
      background:#0c0a10;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;
      opacity:0;animation:fadeUp .45s ease forwards;
    }
    .gcard:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:0 14px 32px rgba(0,0,0,.4)}
    .gimg{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:linear-gradient(135deg,#1a1018,#0a080c)}
    .gmeta{padding:10px 12px 12px}
    .gname{font-weight:600;font-size:.92rem}
    .gtag{color:var(--muted);font-size:.75rem;margin-top:3px}
    .modal-bg{
      position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);
      display:none;place-items:center;padding:20px;
    }
    .modal-bg.open{display:grid}
    .modal{
      width:min(440px,100%);background:#121016;border:1px solid var(--line);
      border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);
      animation:pop .25s ease both;
    }
    .modal img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0a080c}
    .modal .body{padding:16px 18px 18px}
    .modal h3{font-size:1.15rem;margin-bottom:4px}
    .modal .tag{color:var(--rose);font-size:.8rem;font-weight:600;margin-bottom:10px}
    .modal ul{list-style:none;margin:0 0 14px}
    .modal li{padding:6px 0;font-size:.92rem;color:var(--text);display:flex;gap:8px}
    .modal li::before{content:"✓";color:var(--ok);font-weight:700}
    .modal .row{display:flex;gap:10px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="wrap" id="app" style="display:none">
    <div class="top">
      <div class="brand">
        <img src="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" alt="Emorce" />
        <div>
          <h1>Emorce Hub</h1>
          <p class="muted">Unlocked · loadstring + games</p>
        </div>
      </div>
      <button class="btn btn-g" id="logout" type="button">Log out</button>
    </div>
    <div class="card">
      <h2>Loadstring</h2>
      <pre id="ls">loadstring(game:HttpGet("https://emorce-hub.vercel.app/loader.lua"))()</pre>
      <button class="btn btn-p" id="copyLs" style="margin-top:12px" type="button">Copy loadstring</button>
    </div>
    <div class="card" style="animation-delay:.06s">
      <h2>Games</h2>
      <p class="muted" style="margin-bottom:14px">Click a card for features. Run the loadstring in that game.</p>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div class="modal-bg" id="detail">
    <div class="modal">
      <img id="dImg" alt="" />
      <div class="body">
        <h3 id="dName"></h3>
        <div class="tag" id="dTag"></div>
        <ul id="dFeat"></ul>
        <div class="row">
          <button class="btn btn-g" type="button" id="dClose" style="flex:1">Close</button>
          <button class="btn btn-p" type="button" id="dCopy" style="flex:1">Copy loadstring</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      let ok = false;
      try { ok = sessionStorage.getItem("emorce_hub_auth") === "1"; } catch (e) {}
      if (!ok) { location.replace("/"); return; }
      document.getElementById("app").style.display = "block";
      const GAMES = [{"id":"142823291","name":"Murder Mystery 2","tag":"MM2","features":["Silent aim","ESP","Auto farm","Kill aura","Speed / jump"]},{"id":"155615604","name":"Prison Life","tag":"Prison","features":["Arrest / jail tools","Gun mods","Noclip","Teleport","ESP"]},{"id":"286090429","name":"Arsenal","tag":"FPS","features":["Silent aim","ESP","Triggerbot","Hitbox","FOV circle"]},{"id":"443406476","name":"Project Lazarus","tag":"Zombie","features":["Auto farm","Gun mods","Max kills","Fire rate","No fall"]},{"id":"3039388345","name":"Shinjuku 2006","tag":"Combat","features":["Anti lock","No mercy","Inf stamina","Anims","Player lock"]},{"id":"4581966615","name":"Anomic","tag":"Crime","features":["Combat tools","ESP","Vehicle","Utility","Emorce UI"]},{"id":"6961824067","name":"Fling Things and People","tag":"Fling","features":["Fling tools","Orbit","Prop control","UI shell"]},{"id":"8908228901","name":"SharkBite 2","tag":"Shark","features":["Auto farm","Boat tools","ESP","Utility"]},{"id":"9872472334","name":"Evade","tag":"Escape","features":["ESP","Speed","Noclip","Utility"]},{"id":"16116270224","name":"Dandy's World","tag":"Horror","features":["ESP","Auto tasks","Utility"]},{"id":"17625359962","name":"Rivals","tag":"PvP","features":["Aim","ESP","Combat","Session key"]},{"id":"18687417158","name":"Forsaken","tag":"Survival","features":["ESP","Generators","Stamina","Utility"]},{"id":"2474168535","name":"Westbound","tag":"Western","features":["Aim lock","Shootbot","ESP","Br3ak3r","Fullbright"]},{"id":"4924922222","name":"Brookhaven","tag":"RP","features":["Avatar","House RGB","Vehicles","Tools","Teleports"]},{"id":"72169370437173","name":"Tribes 3v3","tag":"PvP","features":["Combat","ESP","Utility"]},{"id":"78515283254292","name":"Animal Hospital","tag":"Sim","features":["ESP","Auto tasks","Inf sanity","Utility"]},{"id":"79546208627805","name":"99 Nights in the Forest","tag":"Horror","features":["ESP","Utility","Survival tools"]},{"id":"93978595733734","name":"Violence District","tag":"Crime","features":["Combat","ESP","Utility"]},{"id":"94217045453265","name":"Dueling Grounds","tag":"PvP","features":["Aim","Combat","ESP"]},{"id":"99409088950210","name":"Survive a Million Monkeys","tag":"Survival","features":["ESP","Auto farm","Utility"]},{"id":"107535308163741","name":"Hush Valley","tag":"Horror","features":["ESP","Utility"]},{"id":"107778070777162","name":"Steal An Egg","tag":"Steal","features":["Auto steal","ESP","Speed"]},{"id":"111600158364583","name":"One Shot","tag":"FPS","features":["Silent aim","ESP","Fly / noclip","Config"]},{"id":"114574503491412","name":"Anime Zero","tag":"Anime","features":["Combat","ESP","Farm"]},{"id":"118418618261207","name":"Runaways","tag":"Adventure","features":["ESP","Utility"]},{"id":"121165298854655","name":"Don't Let Him In","tag":"Horror","features":["ESP","Utility"]},{"id":"126987974021910","name":"Illegal Soccer","tag":"Sports","features":["Ball tools","ESP","Utility"]},{"id":"128541381932893","name":"Kabuki","tag":"Combat","features":["Combat","ESP","Emorce UI"]},{"id":"134728380684025","name":"Aisle of the Locust","tag":"Horror","features":["ESP","Utility"]}];
      const LS = document.getElementById("ls").textContent.trim();
      const grid = document.getElementById("grid");
      const detail = document.getElementById("detail");
      const iconMap = {};
      const ids = GAMES.map(g => g.id).join(",");
      fetch("https://thumbnails.roblox.com/v1/places/gameicons?placeIds=" + ids + "&returnPolicy=PlaceHolder&size=512x512&format=Png")
        .then(r => r.json())
        .then(data => {
          (data.data || []).forEach(x => { if (x.imageUrl) iconMap[String(x.targetId)] = x.imageUrl; });
          document.querySelectorAll(".gimg[data-id]").forEach(img => {
            const u = iconMap[img.dataset.id];
            if (u) img.src = u;
          });
          const dimg = document.getElementById("dImg");
          if (dimg.dataset.id && iconMap[dimg.dataset.id]) dimg.src = iconMap[dimg.dataset.id];
        }).catch(() => {});
      GAMES.forEach((g, i) => {
        const el = document.createElement("div");
        el.className = "gcard";
        el.style.animationDelay = (0.03 * (i % 12)) + "s";
        el.innerHTML =
          '<img class="gimg" data-id="' + g.id + '" alt="" src="data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250"><rect fill="#120e16" width="100%" height="100%"/></svg>') + '" />' +
          '<div class="gmeta"><div class="gname">' + g.name + '</div><div class="gtag">' + g.tag + '</div></div>';
        el.onclick = () => openDetail(g);
        grid.appendChild(el);
      });
      function openDetail(g) {
        document.getElementById("dName").textContent = g.name;
        document.getElementById("dTag").textContent = g.tag;
        const ul = document.getElementById("dFeat");
        ul.innerHTML = "";
        (g.features || []).forEach(f => {
          const li = document.createElement("li");
          li.textContent = f;
          ul.appendChild(li);
        });
        const img = document.getElementById("dImg");
        img.dataset.id = g.id;
        img.src = iconMap[g.id] || "";
        detail.classList.add("open");
      }
      document.getElementById("dClose").onclick = () => detail.classList.remove("open");
      detail.addEventListener("click", e => { if (e.target === detail) detail.classList.remove("open"); });
      async function copyLS() {
        try { await navigator.clipboard.writeText(LS); }
        catch (e) {
          const ta = document.createElement("textarea");
          ta.value = LS; document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); ta.remove();
        }
      }
      document.getElementById("copyLs").onclick = async function () {
        await copyLS();
        this.textContent = "Copied";
        setTimeout(() => this.textContent = "Copy loadstring", 1200);
      };
      document.getElementById("dCopy").onclick = async function () {
        await copyLS();
        this.textContent = "Copied";
        setTimeout(() => this.textContent = "Copy loadstring", 1200);
      };
      document.getElementById("logout").onclick = function () {
        try { sessionStorage.removeItem("emorce_hub_auth"); } catch (e) {}
        location.replace("/");
      };
    })();
  </script>
</body>
</html>
