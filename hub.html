<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emorce Hub · Dashboard</title>
  <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#050508;--card:rgba(18,14,22,.88);--line:rgba(255,80,120,.2);--pink:#ff2d6a;--rose:#ff5e8a;--crimson:#dc143c;--text:#f7f2f5;--muted:#9a8f98;--ok:#5dffb1;--font:"Inter",ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);color:var(--text);min-height:100vh;background:radial-gradient(900px 420px at 20% -10%,rgba(220,20,60,.18),transparent 55%),radial-gradient(700px 400px at 90% 100%,rgba(80,0,40,.22),transparent 50%),var(--bg)}
    .wrap{width:min(1080px,calc(100% - 36px));margin:0 auto;padding:36px 0 70px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700}
    .brand img{width:38px;height:38px;border-radius:11px;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 18px rgba(255,45,106,.3)}
    h1{font-size:1.45rem;letter-spacing:-.03em}
    .muted{color:var(--muted);font-size:.9rem;margin-top:3px}
    .btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.9rem;transition:transform .15s}
    .btn:hover{transform:translateY(-1px)}
    .btn-p{background:linear-gradient(135deg,var(--pink),var(--crimson));color:#fff;box-shadow:0 10px 28px rgba(220,20,60,.3)}
    .btn-g{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--muted)}
    .btn-g:hover{color:var(--text)}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:18px;margin-top:14px;backdrop-filter:blur(10px);animation:fadeUp .45s ease both}
    h2{font-size:1.05rem;margin-bottom:12px}
    pre{background:#08060a;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;overflow:auto;color:#ffc0d0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .gcard{overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.06);background:#0c0a10;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;opacity:0;animation:fadeUp .45s ease forwards}
    .gcard:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:0 14px 32px rgba(0,0,0,.4)}
    .gimg{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#120e16}
    .gmeta{padding:10px 12px 12px}
    .gname{font-weight:600;font-size:.92rem}
    .gtag{color:var(--muted);font-size:.75rem;margin-top:3px}
    .modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px}
    .modal-bg.open{display:grid}
    .modal{width:min(440px,100%);background:#121016;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .25s ease both}
    .modal img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0a080c;max-height:220px}
    .modal .body{padding:16px 18px 18px}
    .modal h3{font-size:1.15rem;margin-bottom:4px}
    .modal .tag{color:var(--rose);font-size:.8rem;font-weight:600;margin-bottom:10px}
    .modal ul{list-style:none;margin:0 0 14px}
    .modal li{padding:6px 0;font-size:.92rem;display:flex;gap:8px}
    .modal li::before{content:"✓";color:var(--ok);font-weight:700}
    .modal .row{display:flex;gap:10px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="wrap" id="app" style="display:none">
    <div class="top">
      <div class="brand">
        <img src="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" alt="Emorce" />
        <div>
          <h1>Emorce Hub</h1>
          <p class="muted">Unlocked · loadstring + games</p>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <a class="btn btn-g" href="/">Home</a>
        <button class="btn btn-g" id="logout" type="button">Log out</button>
      </div>
    </div>
    <div class="card">
      <h2>Loadstring</h2>
      <pre id="ls">loadstring(game:HttpGet("https://emorce-hub.vercel.app/loader.lua"))()</pre>
      <button class="btn btn-p" id="copyLs" style="margin-top:12px" type="button">Copy loadstring</button>
    </div>
    <div class="card" style="animation-delay:.06s">
      <h2>Games</h2>
      <p class="muted" style="margin-bottom:14px">Click a card for features. Run the loadstring in that game.</p>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div class="modal-bg" id="detail">
    <div class="modal">
      <img id="dImg" alt="" />
      <div class="body">
        <h3 id="dName"></h3>
        <div class="tag" id="dTag"></div>
        <ul id="dFeat"></ul>
        <div class="row">
          <button class="btn btn-g" type="button" id="dClose" style="flex:1">Close</button>
          <button class="btn btn-p" type="button" id="dCopy" style="flex:1">Copy loadstring</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      let ok = false;
      try { ok = sessionStorage.getItem("emorce_hub_auth") === "1"; } catch (e) {}
      if (!ok) { location.replace("/"); return; }
      document.getElementById("app").style.display = "block";
      const LS = document.getElementById("ls").textContent.trim();
      const grid = document.getElementById("grid");
      const detail = document.getElementById("detail");
      fetch("/games.json").then(r => r.json()).then(GAMES => {
        GAMES.forEach((g, i) => {
          const el = document.createElement("div");
          el.className = "gcard";
          el.style.animationDelay = (0.03 * (i % 12)) + "s";
          el.innerHTML = '<img class="gimg" src="' + (g.img || "") + '" alt="" loading="lazy" /><div class="gmeta"><div class="gname">' + g.name + '</div><div class="gtag">' + g.tag + '</div></div>';
          el.onclick = () => openDetail(g);
          grid.appendChild(el);
        });
      }).catch(() => { grid.innerHTML = "<p class='muted'>failed to load games</p>"; });
      function openDetail(g) {
        document.getElementById("dName").textContent = g.name;
        document.getElementById("dTag").textContent = g.tag;
        const ul = document.getElementById("dFeat");
        ul.innerHTML = "";
        (g.features || []).forEach(f => { const li = document.createElement("li"); li.textContent = f; ul.appendChild(li); });
        document.getElementById("dImg").src = g.img || "";
        detail.classList.add("open");
      }
      document.getElementById("dClose").onclick = () => detail.classList.remove("open");
      detail.addEventListener("click", e => { if (e.target === detail) detail.classList.remove("open"); });
      async function copyLS() {
        try { await navigator.clipboard.writeText(LS); }
        catch (e) { const ta = document.createElement("textarea"); ta.value = LS; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      }
      document.getElementById("copyLs").onclick = async function () { await copyLS(); this.textContent = "Copied"; setTimeout(() => this.textContent = "Copy loadstring", 1200); };
      document.getElementById("dCopy").onclick = async function () { await copyLS(); this.textContent = "Copied"; setTimeout(() => this.textContent = "Copy loadstring", 1200); };
      document.getElementById("logout").onclick = function () { try { sessionStorage.removeItem("emorce_hub_auth"); } catch (e) {} location.replace("/"); };
    })();
  </script>
</body>
</html>
