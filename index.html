<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emorce Hub — Login</title>
  <style>
    :root {
      --bg: #07050a;
      --card: #120e14;
      --line: rgba(220, 20, 60, 0.35);
      --pink: #dc143c;
      --rose: #ff3264;
      --text: #f5f0f2;
      --muted: #a08e93;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(220, 20, 60, 0.22), transparent 55%),
        radial-gradient(700px 400px at 80% 100%, rgba(80, 0, 30, 0.35), transparent 50%),
        var(--bg);
    }
    .gate {
      width: min(420px, calc(100% - 32px));
      padding: 28px 24px 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(18, 14, 20, 0.92);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0a080c;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: var(--rose); }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .enter { background: var(--pink); color: #fff; }
    .enter:hover { background: var(--rose); }
    .close { background: #1a1218; color: var(--muted); border: 1px solid var(--line); }
    .close:hover { color: var(--text); }
    .msg {
      min-height: 20px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--rose);
    }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="brand">
      <img src="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" alt="Emorce" />
      <h1>Emorce Hub</h1>
    </div>
    <p>Log in to enter and view scripts. No key = site closes.</p>
    <label for="key">Key</label>
    <input id="key" type="password" autocomplete="off" placeholder="enter key" autofocus />
    <div class="row">
      <button class="enter" id="enter" type="button">Enter</button>
      <button class="close" id="close" type="button">Close</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    (function () {
      const KEY = "demorce22";
      const input = document.getElementById("key");
      const msg = document.getElementById("msg");

      function deny(text) {
        msg.textContent = text || "Wrong key.";
        input.value = "";
        input.focus();
      }

      function closeSite() {
        try { window.close(); } catch (e) {}
        document.documentElement.innerHTML = "";
        document.write("<!DOCTYPE html><html><head><title>Closed</title></head><body style=\"margin:0;background:#000;color:#666;display:grid;place-items:center;height:100vh;font-family:sans-serif\">Access denied</body></html>");
        document.close();
      }

      function tryEnter() {
        const got = String(input.value || "").trim().toLowerCase();
        if (!got) {
          deny("Enter a key.");
          return;
        }
        if (got !== KEY) {
          deny("Wrong key. Closing…");
          setTimeout(closeSite, 700);
          return;
        }
        try { sessionStorage.setItem("emorce_hub_auth", "1"); } catch (e) {}
        location.replace("/hub.html");
      }

      document.getElementById("enter").onclick = tryEnter;
      document.getElementById("close").onclick = closeSite;
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") tryEnter();
      });
    })();
  </script>
</body>
</html>
