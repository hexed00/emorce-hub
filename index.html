<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emorce Hub</title>
  <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" />
  <link rel="apple-touch-icon" href="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#050508; --card:rgba(18,14,22,.85); --line:rgba(255,80,120,.22);
      --pink:#ff2d6a; --rose:#ff5e8a; --crimson:#dc143c; --text:#f7f2f5; --muted:#9a8f98;
      --font:"Inter",ui-sans-serif,system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:var(--font);color:var(--text);min-height:100vh;
      display:grid;place-items:center;
      background:
        radial-gradient(900px 480px at 50% -10%, rgba(220,20,60,.22), transparent 55%),
        radial-gradient(700px 400px at 90% 100%, rgba(80,0,40,.28), transparent 50%),
        var(--bg);
    }
    .gate{
      width:min(420px, calc(100% - 32px));
      padding:28px 24px 22px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--card);
      backdrop-filter:blur(14px);
      box-shadow:0 24px 70px rgba(0,0,0,.5), 0 0 50px rgba(255,45,106,.12);
      animation:pop .35s ease both;
    }
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 22px rgba(255,45,106,.35)}
    h1{font-size:1.35rem;letter-spacing:-.02em;margin:0}
    .sub{color:var(--muted);font-size:.92rem;line-height:1.5;margin:0 0 18px}
    label{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    input{
      width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
      background:#08060a;color:var(--text);font-size:1rem;outline:none;font-family:inherit;
    }
    input:focus{border-color:var(--rose)}
    .msg{color:#ff7a90;font-size:.85rem;min-height:1.2em;margin:10px 0 8px}
    .row{display:flex;gap:10px}
    .btn{
      flex:1;border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;
      font-family:inherit;font-size:.95rem;transition:transform .15s,box-shadow .15s,background .15s;
    }
    .btn:hover{transform:translateY(-1px)}
    .enter{background:linear-gradient(135deg,var(--pink),var(--crimson));color:#fff;box-shadow:0 10px 28px rgba(220,20,60,.35)}
    .buy{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.1)}
    .buy:hover{color:var(--text)}
    .foot{margin-top:16px;text-align:center;color:var(--muted);font-size:.8rem}
    #loader{
      position:fixed;inset:0;z-index:100;display:none;place-items:center;
      background:rgba(5,5,8,.92);backdrop-filter:blur(10px);
    }
    #loader.on{display:grid}
    .spin-wrap{text-align:center}
    .ring{
      width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
      border:3px solid rgba(255,255,255,.08);border-top-color:var(--pink);
      animation:spin .8s linear infinite;
    }
    .spin-wrap p{color:var(--muted);font-size:.95rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="brand">
      <img src="https://i.pinimg.com/736x/b6/5c/9f/b65c9ffe02a7ffad3e5b3685a3daa08e.jpg" alt="Emorce" />
      <div><h1>Emorce</h1></div>
    </div>
    <p class="sub">Enter your key to unlock the hub. Scripts stay locked until you do.</p>
    <label for="key">Key</label>
    <input id="key" type="password" placeholder="••••••••" autocomplete="off" />
    <div class="msg" id="msg"></div>
    <div class="row">
      <button class="btn buy" type="button" id="buy">Buy perm key</button>
      <button class="btn enter" type="button" id="enter">Enter</button>
    </div>
    <p class="foot">loader + scripts unlock after key</p>
  </div>
  <div id="loader">
    <div class="spin-wrap">
      <div class="ring"></div>
      <p>Unlocking Emorce…</p>
    </div>
  </div>
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("emorce_hub_auth") === "1") {
          location.replace("/hub.html");
          return;
        }
      } catch (e) {}
      const input = document.getElementById("key");
      const msg = document.getElementById("msg");
      const loader = document.getElementById("loader");
      async function go() {
        const key = input.value.trim();
        msg.textContent = "";
        if (!key) { msg.textContent = "enter a key"; return; }
        try {
          const r = await fetch("/api/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key }),
          });
          const j = await r.json().catch(() => ({}));
          if (r.ok && j.ok) {
            try { sessionStorage.setItem("emorce_hub_auth", "1"); } catch (e) {}
            loader.classList.add("on");
            setTimeout(() => { location.href = "/hub.html"; }, 1100);
            return;
          }
          msg.textContent = "invalid key";
          input.value = "";
          input.focus();
        } catch (e) {
          msg.textContent = "auth failed";
        }
      }
      document.getElementById("enter").onclick = go;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      document.getElementById("buy").onclick = function () {
        msg.textContent = "perm keys · contact Axion";
      };
      input.focus();
    })();
  </script>
</body>
</html>
